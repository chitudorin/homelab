# GitHub's "Automatically delete head branches" setting only fires on merge.
# This deletes the head branch whenever a PR is closed, merged or not.
name: delete-closed-branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    # Fork PRs get a read-only token, and their branch lives in the fork anyway.
    # Never delete the default branch, even if a PR was opened from it.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        # Already gone (deleted by hand, or by the merge setting) is fine; any other
        # failure, like a permissions error, should fail the job.
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" --silent 2>/dev/null; then
            echo "Branch ${BRANCH} already deleted"
            exit 0
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
