name: tofu

# PRs: fmt + validate (no secrets), then a read-only plan.
# main: plan, wait for the owner's approval, then apply exactly that plan.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/tofu.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/tofu.yml"
  # Re-run on main by hand, e.g. after changing the TF_VAR_admin_cidrs secret.
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: read the code, nothing else.
permissions:
  contents: read

# One run per PR (a new push cancels the old plan); runs on main queue up and
# are never cancelled mid-apply. Separate groups, so a PR plan can't push a
# pending apply out of the queue.
concurrency:
  group: tofu-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.*)$
  TOFU_VERSION: "1.13.1"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

defaults:
  run:
    working-directory: infra

jobs:
  check:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu fmt -check -recursive -diff
      # No backend, no secrets: checks syntax, types and references only.
      - run: tofu init -backend=false
      - run: tofu validate

  plan:
    needs: check
    # Fork PRs get no secrets, so skip the plan instead of failing on it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # No approval needed. Its secrets are read-only tokens (see infra/README.md).
    environment: infra-plan
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      TF_VAR_admin_cidrs: ${{ secrets.TF_VAR_admin_cidrs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: tofu init
      # -lock=false: the read-only R2 token can't write the .tflock object.
      # Safe for a plan, which never writes state; apply takes the lock.
      # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes.
      - id: plan
        run: |
          set +e
          tofu plan -lock=false -detailed-exitcode -out=main.tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Plan to job summary
        run: |
          {
            echo '```'
            tofu show -no-color main.tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The plan file is encrypted (versions.tf enforces plan encryption), so the
      # artifact is ciphertext to anyone who downloads it.
      - if: github.event_name != 'pull_request' && steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: infra/main.tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # Required reviewer (the owner) + deployment branch policy "main" only.
    # The job, and its secrets, wait here until the owner approves.
    environment: infra-apply
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
      TF_VAR_state_passphrase: ${{ secrets.TF_VAR_state_passphrase }}
      TF_VAR_admin_cidrs: ${{ secrets.TF_VAR_admin_cidrs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: infra
      - run: tofu init
      # Applies the plan the owner saw in the summary, nothing else. If state
      # changed since (e.g. a laptop apply), tofu refuses the stale plan.
      - run: tofu apply main.tfplan
